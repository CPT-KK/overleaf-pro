# ---------------------------------
# This workflow is used to build development images
# and push them to GitHub Container Registry
#
# Published at:
#     ghcr.io/cpt-kk/overleaf-pro/dev
#
# ---------------------------------

name: Build Development Image
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/cpt-kk/overleaf-pro/dev

jobs:
  build-image:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image-name:
          [
            web,
            webpack,
            real-time,
            project-history,
            linked-url-proxy,
            notifications,
            history-v1,
            filestore,
            document-updater,
            docstore,
            chat,
            clsi
          ]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            platform_pair: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_pair: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Checkout Current Repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: "Setup node environment"
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
      - name: "Sync yarn.lock"
        run: |
          corepack enable
          yarn install --mode=update-lockfile
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ${{env.GHCR_REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      # OCI manifests are needed so the merged index can carry annotations
      - name: Set up Docker (enable containerd image store)
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Disable buildx default attestations
        run: |
          echo "BUILDX_NO_DEFAULT_ATTESTATIONS=1" >> $GITHUB_ENV
      - name: "Clone Overleaf And Build"
        env:
          PLATFORM_PAIR: ${{ matrix.platform_pair }}
        run: |
          export BUILDX_NO_DEFAULT_ATTESTATIONS=1
          cd ./develop/
          bin/build ${{matrix.image-name}}
          docker tag develop-${{matrix.image-name}}:latest ${{env.REGISTRY_IMAGE}}:${{matrix.image-name}}-${PLATFORM_PAIR}
          docker push ${{env.REGISTRY_IMAGE}}:${{matrix.image-name}}-${PLATFORM_PAIR}
  
  merge:
    runs-on: ubuntu-24.04
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        image-name: [
          web,
          webpack,
          real-time,
          project-history,
          linked-url-proxy,
          notifications,
          history-v1,
          filestore,
          document-updater,
          docstore,
          chat,
          clsi
        ]

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest list (multi-arch tag)
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=overleaf-pro-dev-${{ matrix.image-name }}" \
            --annotation "index:org.opencontainers.image.description=Overleaf Pro development image for the ${{ matrix.image-name }} service, maintained by CptKK." \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.version=${{ github.sha }}" \
            -t ${{ env.REGISTRY_IMAGE }}:${{ matrix.image-name }} \
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.image-name }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.image-name }}-arm64

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ matrix.image-name }}

  clean-image:
    runs-on: ubuntu-24.04
    needs: merge
    steps:
      - name: Delete old images
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: overleaf-pro/dev
          cut-off: 7d
          account: user
          tag-selection: untagged
          token: ${{ secrets.GITHUB_TOKEN }}
