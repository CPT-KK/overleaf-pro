# ---------------------------------
# This workflow is used to build and publish operations images manually
#
# Published at:
#     ghcr.io/cpt-kk/overleaf-pro/ops
#
# ---------------------------------

name: Build Operations Image
on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache"
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cpt-kk/overleaf-pro

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      # Build the exact commit selected for this manual run.
      - name: "Checkout Current Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ${{env.DOCKER_REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      
      # --- We need to sync yarn.lock/i18 to ensure consistency ---
      - name: "Sync yarn.lock And Prepare .dockerignore"
        run: |
          docker run --rm -v "$(pwd)":/workspace -w /workspace node:24.18.1 sh -c "corepack enable && yarn install --mode=update-lockfile"
          # Apply the highest-versioned locale patch over the base locales before extracting
          patch_dir=$(printf '%s\n' services/web/locales/locales_patches/v*/ | sort -V | tail -n1)
          if [ -d "$patch_dir" ]; then
            echo "Applying locale patch: $patch_dir"
            cp "$patch_dir"*.json services/web/locales/
          else
            echo "No locale patch directory found; skipping"
          fi
          # Merge the added translations over the patched locales
          for f in services/web/locales/locales_patches/added/*.json; do
            [ -f "$f" ] || continue  # no added translations
            lang=$(basename "$f")
            [ "$lang" = added-translations.json ] && continue
            jq -s '.[0] * .[1]' "services/web/locales/$lang" "$f" > "$f.tmp"
            mv "$f.tmp" "services/web/locales/$lang"
          done
          cd ./server-ce/
          cp .dockerignore ../

      # --- Set up Docker ---
      # See: https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Set up Docker (enable containerd image store)
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Buildx (docker driver)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # --- Build Base Image ---
      - name: "Build base image (hash cache)"
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./server-ce/Dockerfile-base
          load: true
          push: false
          pull: true
          tags: |
            overleaf-pro-base:ci
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha,scope=base-${{ hashFiles('server-ce/Dockerfile-base') }}
          cache-to: type=gha,mode=max,scope=base-${{ hashFiles('server-ce/Dockerfile-base') }}
          provenance: false
          sbom: false
      # --- End of Base Image ---
      
      # --- Build Server Image ---
      - name: "Get MONOREPO_REVISION"
        id: vars
        run: echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: "Build Server image"
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./server-ce/Dockerfile
          load: true
          push: false
          pull: false
          build-args: |
            OVERLEAF_BASE_TAG=overleaf-pro-base:ci
          tags: |
            sharelatex/sharelatex:latest
          annotations: |
            org.opencontainers.image.title=overleaf-pro-ops
            org.opencontainers.image.description=Overleaf Pro operations image, built manually from the selected branch, maintained by CptKK. For testing only.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.MONOREPO_REVISION }}
            space.ayaka.overleaf-pro.ops.revision=${{ steps.vars.outputs.MONOREPO_REVISION }}
          # We don't want -${{ github.ref_name }} limit, just more cache hit
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
          provenance: false
          sbom: false
      # --- End of Server Image ---

      # --- Push Server Image ---
      - name: "ReTag Docker Image And Push"
        run: |
          cd ./server-ce
          github_short_sha=$(echo ${{ github.sha }} | head -c7)
          tag=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M')-$github_short_sha
          echo "Building tag: $tag"
          docker tag sharelatex/sharelatex:latest ${{env.DOCKER_REGISTRY}}/${{env.IMAGE_NAME}}/ops:$tag
          docker push ${{env.DOCKER_REGISTRY}}/${{env.IMAGE_NAME}}/ops:$tag
          # Scheduled tests use latest; only server-pro builds may update it.
          if [ "$GITHUB_REF" = "refs/heads/server-pro" ]; then
            docker tag sharelatex/sharelatex:latest ${{env.DOCKER_REGISTRY}}/${{env.IMAGE_NAME}}/ops:latest
            docker push ${{env.DOCKER_REGISTRY}}/${{env.IMAGE_NAME}}/ops:latest
          fi

      # --- Retention Policy: Delete old images ---
      - name: Delete old images
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: overleaf-pro/ops
          cut-off: 7d
          account: user
          tag-selection: both
          token: ${{ secrets.GITHUB_TOKEN }}
