# ---------------------------------
# This workflow is used to build release images
# and push them to GitHub Container Registry
#
# Published at:
#     ghcr.io/<repository-owner>/<repository-name>/
#
# ---------------------------------

name: Build Release Image

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (optional; defaults to release version or sha-<commit>)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      registry_image: ${{ steps.release.outputs.registry_image }}
      image_name: ${{ steps.release.outputs.image_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve image name and version for the selected ref
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF_NAME" == release-v* ]]; then
              version="${GITHUB_REF_NAME#release-v}"
            else
              version="sha-${GITHUB_SHA:0:12}"
            fi
          fi
          # Reserve six characters for the per-platform -amd64/-arm64 suffix.
          if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,121}$ ]]; then
            echo "::error::Image version must be a valid Docker tag of at most 122 characters."
            exit 1
          fi
          echo "registry_image=$GHCR_REGISTRY/$repository" >> "$GITHUB_OUTPUT"
          echo "image_name=${repository#*/}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $GITHUB_REPOSITORY at $GITHUB_REF_NAME ($GITHUB_SHA) as $version"

  build:
    needs: prepare
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.registry_image }}
      version: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Resolve MONOREPO_REVISION
        run: |
          echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          arch=${platform##*/}
          echo "PLATFORM_PAIR=$arch" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # --- We need to sync yarn.lock/i18 to ensure consistency ---
      - name: "Sync yarn.lock And Prepare .dockerignore"
        run: |
          docker run --rm -v "$(pwd)":/workspace -w /workspace node:24.18.1 sh -c "corepack enable && yarn install --mode=update-lockfile"
          # Apply the highest-versioned locale patch over the base locales before extracting
          patch_dir=$(printf '%s\n' services/web/locales/locales_patches/v*/ | sort -V | tail -n1)
          if [ -d "$patch_dir" ]; then
            echo "Applying locale patch: $patch_dir"
            cp "$patch_dir"*.json services/web/locales/
          else
            echo "No locale patch directory found; skipping"
          fi
          # Merge the added translations over the patched locales
          for f in services/web/locales/locales_patches/added/*.json; do
            [ -f "$f" ] || continue  # no added translations
            lang=$(basename "$f")
            [ "$lang" = added-translations.json ] && continue
            jq -s '.[0] * .[1]' "services/web/locales/$lang" "$f" > "$f.tmp"
            mv "$f.tmp" "services/web/locales/$lang"
          done
          docker run --rm -v "$(pwd)/services/web/":/overleaf/services/web -w /overleaf/services/web ghcr.io/ayaka-notes/overleaf-pro/dev:webpack yarn run extract-translations
          cd ./server-ce/
          cp .dockerignore ../
      
      # --- Set up Docker ---
      # See: https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Set up Docker (enable containerd image store)
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Buildx (docker driver)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build Base Image
        id: build_base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server-ce/Dockerfile-base
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}-base:latest-${{ env.PLATFORM_PAIR }}-${{ env.MONOREPO_REVISION }}-${{ github.run_id }}
          push: false
          load: true
          provenance: false
          sbom: false
      - name: Build App Image
        id: build_app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server-ce/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            OVERLEAF_BASE_TAG=${{ env.REGISTRY_IMAGE }}-base:latest-${{ env.PLATFORM_PAIR }}-${{ env.MONOREPO_REVISION }}-${{ github.run_id }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            com.overleaf.pro.revision=${{ env.MONOREPO_REVISION }}
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.version }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name-canonical=true,push=true
          provenance: false
          sbom: false
      
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build_app.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-24.04
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.registry_image }}
      RETENTION_TOKEN: ${{ secrets.ORGTOKEN }}
    needs:
      - prepare
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ needs.prepare.outputs.version }}

      # --- Retention Policy: Delete old images ---
      - name: Delete old images
        if: env.RETENTION_TOKEN != ''
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: ${{ needs.prepare.outputs.image_name }}
          cut-off: 1s
          account: ${{ github.event.repository.owner.type == 'User' && 'user' || github.repository_owner }}
          tag-selection: untagged
          token: ${{ secrets.ORGTOKEN }}

  build_git_bridge:
    needs: prepare
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.registry_image }}
      version: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Resolve MONOREPO_REVISION
        run: |
          echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          arch=${platform##*/}
          echo "PLATFORM_PAIR=$arch" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}/git-bridge

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker (enable containerd image store)
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Buildx (docker driver)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build Git Bridge Image
        id: build_git_bridge
        uses: docker/build-push-action@v7
        with:
          context: ./services/git-bridge
          file: ./services/git-bridge/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            com.overleaf.pro.revision=${{ env.MONOREPO_REVISION }}
          tags: ${{ env.REGISTRY_IMAGE }}/git-bridge:${{ env.version }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build_git_bridge.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: git-bridge-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge_git_bridge:
    runs-on: ubuntu-24.04
    env:
      REGISTRY_IMAGE: ${{ needs.prepare.outputs.registry_image }}
      RETENTION_TOKEN: ${{ secrets.ORGTOKEN }}
    needs:
      - prepare
      - build_git_bridge
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: git-bridge-digests-*
          merge-multiple: true

      - name: Login to GHCR Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}/git-bridge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}/git-bridge@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}/git-bridge:${{ needs.prepare.outputs.version }}

      - name: Delete old images
        if: env.RETENTION_TOKEN != ''
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: ${{ needs.prepare.outputs.image_name }}/git-bridge
          cut-off: 1s
          account: ${{ github.event.repository.owner.type == 'User' && 'user' || github.repository_owner }}
          tag-selection: untagged
          token: ${{ secrets.ORGTOKEN }}
